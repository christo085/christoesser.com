    <main>
    <section class="hero">
       <h1>Contact Me</h1>

       <p>Fill in this form to contact me!</p>
   </section>

<section class="contact-form">
  <div>
      <form name="contact" method="POST" action="/success" data-netlify="true" netlify-honeypot="bot-field">
        <p class="hidden-field">
          <label>Don't fill this out: <input name="bot-field"></label>
        </p>
        <article class="contact-text">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" required>
        </article>
        <article class="contact-text">
            <label for="email">Your Email</label>
            <input type="email" id="email" name="email" required>
        </article>
        <article class="contact-message">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5" required></textarea>
        </article>
        <article class="contact-button">
        <button type="submit">Send Message</button>
    </article>
      </form>
    </div>
</section>
